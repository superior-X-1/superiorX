services:
  - type: web
    name: superiorx-backend
    runtime: python
    repo: https://github.com/superior-X-1/superiorX
    branch: main
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DIGITAL_SIGNATURE_KEY_ID
        value: MX-KEY-2026-V1
      - key: SUPABASE_STORAGE_BUCKET
        value: measurex-storage
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DIGITAL_SIGNATURE_PRIVATE_KEY_PEM
        sync: false
