<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="100%" height="100%">
  <!-- Measure X — Institutional Compact Brand Mark -->
  <rect x="4" y="4" width="56" height="56" rx="10" fill="#0B5D4B" stroke="#C9972B" stroke-width="2.5" />
  
  <!-- Central Calibration Column -->
  <line x1="32" y1="14" x2="32" y2="48" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <!-- Vernier Scale Ticks -->
  <line x1="27" y1="20" x2="37" y2="20" stroke="#C9972B" stroke-width="2" stroke-linecap="round" />
  <line x1="28" y1="26" x2="36" y2="26" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  <line x1="26" y1="32" x2="38" y2="32" stroke="#C9972B" stroke-width="2.5" stroke-linecap="round" />
  <line x1="28" y1="38" x2="36" y2="38" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  <line x1="27" y1="44" x2="37" y2="44" stroke="#C9972B" stroke-width="2" stroke-linecap="round" />

  <!-- Balance Beam -->
  <path d="M16 22 L32 16 L48 22" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="32" cy="16" r="4" fill="#C9972B" stroke="#ffffff" stroke-width="1.5" />

  <!-- Left & Right Pans -->
  <path d="M16 22 L13 33 L19 33 Z" fill="#C9972B" />
  <line x1="10" y1="33" x2="22" y2="33" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

  <path d="M48 22 L45 33 L51 33 Z" fill="#C9972B" />
  <line x1="42" y1="33" x2="54" y2="33" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

  <!-- Verification Checkmark Anchor -->
  <path d="M20 48 L29 55 L47 38" stroke="#C9972B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
